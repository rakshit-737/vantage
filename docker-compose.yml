# OPTIONAL: VANTAGE runs fully in-memory (NetworkX). This Neo4j is only for exploring
# `python -m vantage graph --format cypher` output. Bound to localhost; change the password.
services:
  neo4j:
    image: neo4j:5
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change-me-please
