[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.2.0"
description = "Control -> Detection -> ATT&CK coverage graph and Zero-Trust posture engine (defensive, lab-only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]

[project.optional-dependencies]
data = ["openpyxl>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
report = ["reportlab>=4.0"]
ml = ["sentence-transformers>=2.6"]
bench = ["scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=7", "ruff>=0.4", "httpx>=0.27", "openpyxl>=3.1", "fastapi>=0.110", "uvicorn>=0.29",
       "reportlab>=4.0"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools]
packages = ["vantage", "vantage.ingest"]

[tool.setuptools.package-data]
vantage = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when absent)",
           "ml: needs sentence-transformers and a model download (skipped when absent)"]

[tool.ruff]
line-length = 120
