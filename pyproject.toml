[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
dynamic = ["version"]
description = "Control -> Detection -> ATT&CK coverage graph and Zero-Trust posture engine (defensive, lab-only)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]

[project.optional-dependencies]
data = ["openpyxl>=3.1", "defusedxml>=0.7"]
api = ["fastapi>=0.110", "starlette>=1.3.1", "uvicorn>=0.54.0"]
report = ["reportlab>=4.0"]
ml = ["sentence-transformers>=2.6"]
bench = ["scipy>=1.11", "matplotlib>=3.8"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6", "build>=1.0", "twine>=5", "httpx>=0.27", "openpyxl>=3.1",
       "defusedxml>=0.7", "fastapi>=0.110", "starlette>=1.3.1", "uvicorn>=0.54.0", "reportlab>=4.0"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vantage.__version__" }

[tool.setuptools.packages.find]
include = ["vantage*"]

[tool.setuptools.package-data]
vantage = ["web/*", "postures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when absent)",
           "ml: needs sentence-transformers and a model download (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so results do not change when ruff's defaults change between versions.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"vantage/seed.py" = ["E501"]  # data table
