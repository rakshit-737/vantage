[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
dynamic = ["version"]
description = "Control -> Detection -> ATT&CK coverage graph and Zero-Trust posture engine (defensive, lab-only)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]

[project.optional-dependencies]
data = ["openpyxl>=3.1.5", "defusedxml>=0.7.1"]
api = ["fastapi>=0.110", "starlette>=1.3.1", "uvicorn>=0.54.0"]
report = ["reportlab>=4.0"]
ml = ["sentence-transformers>=6.1.0"]  # < 5.6.0: PYSEC-2026-4164 (local model loading)
bench = ["scipy>=1.15.3", "matplotlib>=3.10.9"]
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=1.0.6", "mkdocs-redirects>=1.2.3"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.9", "build>=1.6.1", "twine>=7.0.0", "httpx>=0.28.1",
       "httpx2>=2.13.1", "openpyxl>=3.1.5", "defusedxml>=0.7.1", "fastapi>=0.110", "starlette>=1.3.1",
       "uvicorn>=0.54.0", "reportlab>=4.0"]

[project.urls]
Homepage = "https://rakshit-737.github.io/vantage/"
Documentation = "https://rakshit-737.github.io/vantage/"
Source = "https://github.com/rakshit-737/vantage"
Changelog = "https://github.com/rakshit-737/vantage/blob/main/CHANGELOG.md"
Issues = "https://github.com/rakshit-737/vantage/issues"

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vantage.__version__" }

[tool.setuptools.packages.find]
include = ["vantage*"]

[tool.setuptools.package-data]
vantage = ["web/*", "postures/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded datasets (skipped when absent)",
           "ml: needs sentence-transformers and a model download (skipped when absent)"]
# Newer Starlette warns when its TestClient runs on httpx instead of httpx2 (in the dev extra):
# fail loudly if that fallback ever happens. Matched on the message, so it is inert without Starlette.
filterwarnings = ["error:Using .httpx. with .starlette.testclient. is deprecated:UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit rule set so results do not change when ruff's defaults change between versions.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"vantage/seed.py" = ["E501"]  # data table
