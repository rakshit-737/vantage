name: Bug report
description: Something in VANTAGE is wrong or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste a real posture file, report or coverage map here: it is a list of blind spots. Use a synthetic org (`vantage synth`)."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Command, full output, expected result"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: "vantage --version, Python version and OS"}
    validations: {required: true}
