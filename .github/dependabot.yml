version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  # pyproject.toml floors and the hash-locked requirements-docker.txt: one grouped PR a week.
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
