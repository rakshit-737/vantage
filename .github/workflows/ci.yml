name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check vantage tests scripts benchmarks
      # realdata tests skip automatically: datasets are never committed
      - run: pytest -q
      - run: python -m vantage demo
      - run: python -m vantage report --pdf /tmp/report.pdf

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vantage .
      - run: |
          docker run -d --name vantage-ci -p 127.0.0.1:8000:8000 vantage
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/meta

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: SAST (bandit)
        run: bandit -r vantage -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
