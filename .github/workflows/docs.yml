name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - name: Static demo is not shadowed by a page and links no API route
        run: |
          grep -q '<title>VANTAGE coverage</title>' site/demo/index.html
          ! grep -q 'href="/api/' site/demo/index.html
          test -s site/demo/data/report.txt && test -s site/demo/data/navigator.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    # After deploy: the live /demo/ renders the matrix (headless Chromium via Playwright).
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Live demo renders
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto("https://rakshit-737.github.io/vantage-compliance-attack-mapping/demo/", wait_until="networkidle")
              pg.wait_for_selector("#matrix .cell", timeout=30000)
              n = pg.locator("#matrix .cell").count()
              print("cells:", n)
              assert n > 100, n
              # every link on the page (report / layer downloads, back to docs) must resolve
              hrefs = pg.eval_on_selector_all("a[href]", "els => els.map(e => e.href)")
              assert hrefs, "no links found"
              for h in sorted(set(hrefs)):
                  st = pg.request.get(h).status
                  print(st, h)
                  assert st == 200, (h, st)
              b.close()
          PY
      - name: Old Evaluation URL redirects
        run: curl -fsSL https://rakshit-737.github.io/vantage-compliance-attack-mapping/benchmarks/ | grep -q "evaluation/"
