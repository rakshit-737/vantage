site_name: VANTAGE
site_description: Control -> Detection -> ATT&CK coverage graph and Zero-Trust posture engine (defensive, lab-only)
site_url: https://rakshit-737.github.io/vantage-compliance-attack-mapping/
repo_url: https://github.com/rakshit-737/vantage-compliance-attack-mapping
repo_name: rakshit-737/vantage-compliance-attack-mapping
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
not_in_nav: |
  /adr/0*.md
plugins:
  - search
  - redirects:
      redirect_maps:
        benchmarks.md: evaluation.md   # the page was served at /benchmarks/ up to v1.1.0
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            show_if_no_docstring: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Evaluation: evaluation.md
  - Reproduce: reproduce.md
  - Live demo (static): live-demo.md
  - Architecture: architecture.md
  - Related work: related-work.md
  - Datasets: datasets.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/api.md
      - Python API: reference/python.md
  - Threat model: threat-model.md
  - Security: security.md
  - ADRs: adr/index.md
  - Limitations & roadmap: limitations.md
  - Changelog: changelog.md
