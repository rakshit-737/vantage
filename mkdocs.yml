site_name: VANTAGE
site_description: Control -> Detection -> ATT&CK coverage graph and Zero-Trust posture engine (defensive, lab-only)
site_url: https://rakshit-737.github.io/vantage/
repo_url: https://github.com/rakshit-737/vantage
repo_name: rakshit-737/vantage
edit_uri: edit/main/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Datasets: datasets.md
  - Benchmarks & results: benchmarks.md
  - Live demo (static): live-demo.md
  - Reference:
      - CLI: reference/cli.md
      - HTTP API: reference/api.md
      - Python API: reference/python.md
  - Threat model: threat-model.md
  - Security: security.md
  - ADRs:
      - adr/index.md
      - adr/0001-real-public-datasets.md
      - adr/0002-carry-cis-mapping-forward.md
      - adr/0003-networkx-core-neo4j-optional.md
      - adr/0004-recommender-cost-model.md
      - adr/0005-mitigation-bridge-automapper.md
      - adr/0006-api-and-ui.md
      - adr/0007-rule-quality-weighting.md
      - adr/0008-nist-800-53.md
  - Limitations & roadmap: limitations.md
  - Changelog: changelog.md
